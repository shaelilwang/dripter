<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Article Drip — Settings</title>
  <link rel="stylesheet" href="ui.css">
  <style>
    body { max-width: 760px; margin: 0 auto; padding: 28px 22px 60px; }
    header { margin-bottom: 22px; }
    header p { color: var(--muted); margin: 6px 0 0; }
    .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0 28px; }
    @media (max-width: 620px) { .cols { grid-template-columns: 1fr; } }
    #doctor-out { max-height: 340px; overflow: auto; }
    .dline { display: flex; gap: 8px; align-items: baseline; padding: 3px 0; }
    .dkey { flex: 0 0 150px; font-weight: 600; }
    .filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
    .filters button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
    .io { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  </style>
</head>
<body>
  <header>
    <h1 style="font-size:22px">Article Drip</h1>
    <p>Saved X Articles and threads, chunked and dripped into your feed.</p>
  </header>

  <div id="msg"></div>

  <h2>Reading</h2>
  <div class="cols">
    <label class="field">
      <span class="lbl">Insert a snippet every</span>
      <span class="hint">How many real posts go by between cards.</span>
      <input type="number" id="everyNPosts" min="1" max="30" step="1"> posts
    </label>

    <label class="field">
      <span class="lbl">Card size</span>
      <span class="hint">Roughly how much text each card carries. Splits happen
        only between paragraphs and sentences the author already wrote — never
        mid-sentence, and nothing is ever added or removed.</span>
      <input type="number" id="maxChars" min="0" max="20000" step="100"> characters
    </label>

    <label class="field">
      <span class="lbl">Cards per article (optional)</span>
      <span class="hint">Leave at 0 to let card size decide. Above 0 this caps
        an article at that many cards by merging whole sections, and takes
        precedence over card size.</span>
      <input type="number" id="maxCards" min="0" max="50" step="1"> cards
    </label>

    <label class="field">
      <span class="lbl">Order</span>
      <span class="hint">Sequential finishes one article before starting the next.</span>
      <select id="order">
        <option value="sequential">Sequential — one at a time</option>
        <option value="roundRobin">Round robin — rotate between articles</option>
        <option value="shuffle">Shuffle — random each card</option>
      </select>
    </label>

    <label class="field">
      <span class="lbl">Count as read after</span>
      <span class="hint">Time a card must stay on screen before it advances.</span>
      <input type="number" id="dwellMs" min="0" max="10000" step="100"> ms
    </label>
  </div>

  <label class="switch" style="margin-bottom:12px">
    <input type="checkbox" id="markReadOnView">
    <span class="track"></span>
    <span>Advance automatically as I scroll past a card</span>
  </label>

  <h2>What to collect</h2>
  <label class="switch" style="display:flex;margin-bottom:10px">
    <input type="checkbox" id="includeArticles"><span class="track"></span>
    <span>Native X Articles</span>
  </label>
  <label class="switch" style="display:flex;margin-bottom:10px">
    <input type="checkbox" id="includeThreads"><span class="track"></span>
    <span>Threads</span>
  </label>
  <label class="field" style="margin-top:10px">
    <span class="lbl">What to open when fetching</span>
    <span class="hint">X shows native Articles in your bookmarks as ordinary posts, so
      the list can't always tell. "Everything" opens each bookmark to find out.</span>
    <select id="fetchScope">
      <option value="likely">Likely long-form only — faster</option>
      <option value="all">Everything — slower, catches disguised Articles</option>
    </select>
  </label>

  <label class="field">
    <span class="lbl">Minimum post length</span>
    <span class="hint">A lone post shorter than this is skipped rather than dripped.</span>
    <input type="number" id="minPostChars" min="0" max="5000" step="50"> characters
  </label>

  <label class="field" style="margin-top:10px">
    <span class="lbl">Minimum thread length</span>
    <span class="hint">Shorter self-threads aren't worth dripping.</span>
    <input type="number" id="minThreadPosts" min="1" max="50" step="1"> posts
  </label>

  <label class="switch" style="display:flex;margin-bottom:10px">
    <input type="checkbox" id="incrementalHarvest"><span class="track"></span>
    <span>Stop re-harvests early once they reach bookmarks I already have</span>
  </label>

  <h2>Library <span id="lib-count" class="muted small" style="text-transform:none;letter-spacing:0"></span></h2>
  <div class="filters" id="filters"></div>
  <div class="panel io" style="margin-bottom:10px">
    <button id="bulk-done" class="tiny">Mark all read</button>
    <button id="bulk-retry" class="tiny">Retry failed</button>
    <button id="bulk-remove" class="tiny danger">Remove finished</button>
    <button id="rechunk" class="tiny">Re-chunk everything</button>
    <span class="small muted" id="bulk-hint"></span>
  </div>
  <div class="items" id="items"></div>

  <h2>Move between machines</h2>
  <div class="panel io">
    <button id="export">Export JSON</button>
    <button id="import">Import JSON…</button>
    <input type="file" id="file" accept="application/json,.json" hidden>
    <span class="small muted">Import merges, keeping whichever copy has read further.</span>
  </div>

  <h2>Selector Doctor</h2>
  <div class="panel" id="doctor-out">
    <span class="muted small">Open x.com, click the extension icon, then “Selector Doctor”.</span>
  </div>

  <h2>Danger zone</h2>
  <div class="panel io">
    <button id="reset-progress" class="danger">Reset all reading progress</button>
    <button id="wipe" class="danger">Delete everything</button>
  </div>

  <script src="../src/chunker.js"></script>
  <script src="../src/store.js"></script>
  <script src="options.js"></script>
</body>
</html>
