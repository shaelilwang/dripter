<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Article Drip — injection harness</title>
  <style>
    body { font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
           margin: 0; display: grid; grid-template-columns: 420px 1fr; height: 100vh; }
    #results { padding: 18px; overflow: auto; border-right: 1px solid #ccc; background: #fafafa; }
    #results h1 { font-size: 16px; margin: 0 0 12px; }
    #results h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
                  color: #666; margin: 16px 0 6px; }
    .t { padding: 2px 0; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
    .t.ok::before  { content: "ok   "; color: #0a7; }
    .t.no::before  { content: "FAIL "; color: #c00; }
    .t.no { color: #c00; }
    #summary { margin-top: 18px; font-weight: 700; padding: 10px; border-radius: 6px; }
    #feed { overflow: auto; padding: 0; }
    /* Deliberately mimics x.com's structure, not its looks. */
    .fakepost { padding: 14px 16px; border-bottom: 1px solid #e6ecf0; }
    .fakepost b { display: block; font-size: 13px; }
    .fakepost p { margin: 4px 0 0; color: #333; }
  </style>
  <link rel="stylesheet" href="../src/card.css">
</head>
<body>
  <div id="results"><h1>Article Drip — injection harness</h1></div>
  <div id="feed"></div>

  <script>
    /* ---- chrome.* shim, enough for store.js + card.js + inject.js ---- */
    (function () {
      let mem = {};
      const listeners = [];
      globalThis.chrome = {
        storage: {
          local: {
            get(keys, cb) {
              let out;
              if (keys == null) out = JSON.parse(JSON.stringify(mem));
              else if (typeof keys === 'string') out = { [keys]: mem[keys] };
              else if (Array.isArray(keys)) { out = {}; for (const k of keys) out[k] = mem[k]; }
              else { out = Object.assign({}, keys); for (const k of Object.keys(keys)) if (k in mem) out[k] = mem[k]; }
              setTimeout(() => cb(out), 0);
            },
            set(obj, cb) {
              const changes = {};
              for (const [k, v] of Object.entries(obj)) changes[k] = { newValue: v };
              Object.assign(mem, JSON.parse(JSON.stringify(obj)));
              setTimeout(() => { cb && cb(); listeners.forEach((f) => f(changes, 'local')); }, 0);
            },
            clear(cb) { mem = {}; setTimeout(() => cb && cb(), 0); },
          },
          onChanged: { addListener: (f) => listeners.push(f) },
        },
        runtime: {
          id: 'harness',
          sendMessage() { return Promise.resolve(); },
          onMessage: { addListener() {} },
          getManifest: () => ({ version: 'harness' }),
        },
        tabs: { create() {}, sendMessage() { return Promise.resolve(); } },
      };
      globalThis.__resetStorage = () => { mem = {}; };
    })();
  </script>

  <script src="../src/lifecycle.js"></script>
  <script src="../src/selectors.js"></script>
  <script src="../src/dom.js"></script>
  <script src="../src/chunker.js"></script>
  <script src="../src/store.js"></script>
  <script src="../src/collect.js"></script>
  <script src="../src/extract.js"></script>
  <script src="../src/card.js"></script>
  <script src="../src/inject.js"></script>

  <script>
  (async function () {
    const { store, inject, chunker } = AD;
    const out = document.getElementById('results');
    const feed = document.getElementById('feed');
    let pass = 0, fail = 0;

    const section = (t) => { const h = document.createElement('h2'); h.textContent = t; out.appendChild(h); };
    const eq2 = (name, a, b) => check(name, JSON.stringify(a) === JSON.stringify(b),
      `expected ${JSON.stringify(b)}, got ${JSON.stringify(a)}`);
    const check = (name, cond, detail) => {
      const d = document.createElement('div');
      d.className = 't ' + (cond ? 'ok' : 'no');
      d.textContent = name + (cond || !detail ? '' : ' — ' + detail);
      out.appendChild(d);
      cond ? pass++ : fail++;
    };

    // Tell the injector this page counts as the home timeline.
    inject._setHomeCheck(() => true);

    /* ---- build a fake timeline with x.com's structural contract ---- */
    function buildFeed(n, { absolute = false } = {}) {
      feed.innerHTML = '';
      const tl = document.createElement('div');
      tl.setAttribute('aria-label', 'Timeline: Your Home Timeline');
      if (absolute) tl.style.position = 'relative';
      for (let i = 0; i < n; i++) {
        const cell = document.createElement('div');
        cell.setAttribute('data-testid', 'cellInnerDiv');
        if (absolute) { cell.style.position = 'absolute'; cell.style.transform = `translateY(${i * 90}px)`; }
        const art = document.createElement('article');
        art.setAttribute('data-testid', 'tweet');
        art.className = 'fakepost';
        art.innerHTML = `<b>@someone</b><p>Real timeline post number ${i}.</p>`;
        cell.appendChild(art);
        tl.appendChild(cell);
      }
      feed.appendChild(tl);
      return tl;
    }

    const cards = () => [...document.querySelectorAll('[data-ad-card]')];
    const cardTexts = () => cards().map((c) => c.querySelector('.ad-text').textContent);

    async function seedArticle(id, nSnippets) {
      await store.upsertItem({
        id, url: 'https://x.com/a/status/' + id, kind: 'article',
        title: 'Test Article ' + id, author: { name: 'A', handle: 'author' },
      });
      await store.setSnippets(id, Array.from({ length: nSnippets },
        (_, i) => ({ text: `${id} · snippet ${i}`, kind: i === 0 ? 'heading' : 'para' })));
    }

    async function fresh(nCells, nSnippets, settings, opts) {
      __resetStorage();
      inject._resetLayout();
      inject.clearCards();
      await store.setSettings(Object.assign({ everyNPosts: 4, markReadOnView: false }, settings || {}));
      await inject._reload();
      await seedArticle('900', nSnippets);
      buildFeed(nCells, opts);
    }

    /* ---------------------------------------------------------------- */
    section('spacing');
    await fresh(12, 50, { everyNPosts: 4 });
    await inject.sweep();
    check('inserts one card per N posts', cards().length === 3, `got ${cards().length}, expected 3`);

    {
      // Each card must sit immediately after every 4th cell.
      const kids = [...document.querySelector('[aria-label^="Timeline:"]').children];
      const positions = kids.map((k, i) => k.matches('[data-ad-card]') ? i : -1).filter((i) => i >= 0);
      check('cards land at the right offsets',
        positions.every((p, i) => p === (i + 1) * 4 + i),
        JSON.stringify(positions));
    }

    section('idempotency');
    {
      const before = cards().length;
      await inject.sweep();
      await inject.sweep();
      check('re-sweeping adds nothing', cards().length === before,
        `${before} then ${cards().length}`);
    }

    section('distinct snippets');
    {
      const texts = cardTexts();
      check('no two visible cards show the same snippet',
        new Set(texts).size === texts.length, JSON.stringify(texts));
      check('snippets come out in order',
        texts.join('|') === ['900 · snippet 0', '900 · snippet 1', '900 · snippet 2'].join('|'),
        JSON.stringify(texts));
      check('heading snippet is styled as one',
        cards()[0].querySelector('.ad-text').classList.contains('is-heading'));
    }

    section('virtualization churn');
    {
      // Simulate X tearing out the top of the list and appending new posts,
      // which is exactly what happens as you scroll.
      const tl = document.querySelector('[aria-label^="Timeline:"]');
      for (let i = 0; i < 5; i++) tl.firstElementChild.remove();
      for (let i = 0; i < 8; i++) {
        const cell = document.createElement('div');
        cell.setAttribute('data-testid', 'cellInnerDiv');
        const art = document.createElement('article');
        art.setAttribute('data-testid', 'tweet');
        art.className = 'fakepost';
        art.innerHTML = `<b>@someone</b><p>Newly loaded post ${i}.</p>`;
        cell.appendChild(art);
        tl.appendChild(cell);
      }
      await inject.sweep();

      const kids = [...tl.children];
      let since = 0, worst = 0, adjacent = false, prevWasCard = false;
      for (const k of kids) {
        const isCard = k.matches('[data-ad-card]');
        if (isCard) {
          if (prevWasCard) adjacent = true;
          worst = Math.max(worst, since);
          since = 0;
        } else since++;
        prevWasCard = isCard;
      }
      check('never leaves a gap wider than N after churn', worst <= 4, `worst gap ${worst}`);
      check('never puts two cards back to back', !adjacent);

      const texts = cardTexts();
      check('still no duplicate snippets after churn',
        new Set(texts).size === texts.length, JSON.stringify(texts));
    }

    section('queue exhaustion');
    await fresh(40, 3, { everyNPosts: 4 });
    await inject.sweep();
    check('stops once snippets run out', cards().length === 3, `got ${cards().length}`);
    check('inserts no empty-state cards mid-feed',
      cards().every((c) => !c.classList.contains('is-empty')));

    section('disabled');
    await fresh(12, 50, { everyNPosts: 4, enabled: false });
    await inject.sweep();
    check('injects nothing when switched off', cards().length === 0, `got ${cards().length}`);

    section('absolute-positioned timeline');
    await fresh(12, 50, { everyNPosts: 4 }, { absolute: true });
    await inject.sweep();
    check('still injects', cards().length === 3, `got ${cards().length}`);
    check('nests inside the cell instead of after it',
      cards().every((c) => c.parentElement.matches('[data-testid="cellInnerDiv"]')));
    await inject.sweep();
    check('idempotent in absolute mode too', cards().length === 3, `got ${cards().length}`);

    section('advancing');
    await fresh(12, 50, { everyNPosts: 4 });
    inject._resetLayout();
    await inject.sweep();
    {
      const first = cards()[0];
      const before = first.querySelector('.ad-text').textContent;
      first.querySelector('[data-ad-act="next"]').click();
      await new Promise((r) => setTimeout(r, 120));
      const after = first.querySelector('.ad-text').textContent;
      check('Next swaps the text in place', before !== after, `${before} -> ${after}`);
      check('Next advanced the stored cursor',
        (await store.getItem('900')).cursor >= 1,
        'cursor ' + (await store.getItem('900')).cursor);

      // Regression: repainting used to bypass the hand-out reservation, so
      // the advanced card landed on a snippet another card was already showing.
      const texts = cardTexts();
      check('Next does not duplicate a snippet another card shows',
        new Set(texts).size === texts.length, JSON.stringify(texts));

      // And repeatedly advancing must keep finding new material.
      for (let i = 0; i < 4; i++) {
        first.querySelector('[data-ad-act="next"]').click();
        await new Promise((r) => setTimeout(r, 90));
      }
      const advanced = cardTexts();
      check('still distinct after several advances',
        new Set(advanced).size === advanced.length, JSON.stringify(advanced));
      check('advancing never lands on the empty state while snippets remain',
        !cards().some((c) => c.classList.contains('is-empty')));
    }

    section('chunker on prose');
    {
      const prose = 'The rollout was staged. Dr. Chen signed off on Jan. 12 without much ceremony. ' +
        'The answer was no. Everyone moved on to the next thing, which took another six weeks.';
      const s = chunker.chunk(prose, { maxChars: 90 });
      check('produces multiple snippets', s.length > 1, `got ${s.length}`);
      check('respects the budget', s.every((x) => x.text.length <= 90),
        'max ' + Math.max(...s.map((x) => x.text.length)));
      check('did not break inside "Jan. 12"',
        !s.some((x) => /Jan\.$/.test(x.text.trim())));
    }

    section('bookmark classification');
    {
      // Mirrors what a live census actually showed: Article markup present
      // (data-testid="article-cover-image") with NO /i/article/ href anywhere.
      // Detection has to work off the marker, not the URL.
      function fakeBookmark({ handle, id, text, article, thread }) {
        const cell = document.createElement('div');
        cell.setAttribute('data-testid', 'cellInnerDiv');
        const art = document.createElement('article');
        art.setAttribute('data-testid', 'tweet');
        art.className = 'fakepost';

        const un = document.createElement('div');
        un.setAttribute('data-testid', 'User-Name');
        un.innerHTML = `<span>Display Name</span><span>@${handle}</span>`;
        art.appendChild(un);

        const tt = document.createElement('div');
        tt.setAttribute('data-testid', 'tweetText');
        tt.textContent = text;
        art.appendChild(tt);

        const a = document.createElement('a');
        a.setAttribute('href', `/${handle}/status/${id}`);
        a.innerHTML = '<time datetime="2026-01-01T00:00:00Z"></time>';
        art.appendChild(a);

        if (article) {
          const cover = document.createElement('div');
          cover.setAttribute('data-testid', 'article-cover-image');
          art.appendChild(cover);
        }
        if (thread) {
          const st = document.createElement('span');
          st.textContent = 'Show this thread';
          art.appendChild(st);
        }
        cell.appendChild(art);
        return cell;
      }

      __resetStorage();
      await store.setSettings({ includeArticles: true, includeThreads: true });
      feed.innerHTML = '';
      const tl = document.createElement('div');
      tl.setAttribute('aria-label', 'Timeline: Bookmarks');
      const long = 'A really quite long bookmarked post. '.repeat(15);
      tl.append(
        fakeBookmark({ handle: 'joulee', id: '111', text: 'Cover-image Article', article: true }),
        fakeBookmark({ handle: 'DeRonin_', id: '222', text: '1/ starting a thread here', thread: true }),
        fakeBookmark({ handle: 'KenWattana', id: '333', text: long }),
        fakeBookmark({ handle: 'buildwithmaya', id: '444', text: 'just a short take' })
      );
      feed.appendChild(tl);

      await AD.collect.harvestVisible(await store.getSettings());
      const items = await store.getItems();

      check('Article detected with no /i/article/ link present',
        items['111'] && items['111'].kind === 'article',
        JSON.stringify(items['111'] && items['111'].kind));
      check('thread detected via "Show this thread"',
        items['222'] && items['222'].kind === 'thread',
        JSON.stringify(items['222'] && items['222'].kind));
      check('long plain post is kept',
        items['333'] && items['333'].kind === 'post');

      // A short post must NOT be dropped here: a native Article looks exactly
      // like one in the bookmarks list, and its body only exists on the status
      // page. Keep it, flag it unlikely, decide after opening it.
      check('short post is kept, not discarded', !!items['444']);
      check('short post is flagged unlikely',
        items['444'] && items['444'].likely === false,
        JSON.stringify(items['444'] && items['444'].likely));
      check('article is flagged likely despite being short',
        items['111'] && items['111'].likely === true);
      check('thread is flagged likely', items['222'] && items['222'].likely === true);
      check('long post is flagged likely', items['333'] && items['333'].likely === true);
      check('handle comes from the permalink',
        items['111'] && items['111'].author.handle === 'joulee',
        JSON.stringify(items['111'] && items['111'].author));
      check('display name survives span-flattening',
        items['111'] && items['111'].author.name === 'Display Name',
        JSON.stringify(items['111'] && items['111'].author));
      check('permalink url is built correctly',
        items['111'] && items['111'].statusUrl === 'https://x.com/joulee/status/111',
        JSON.stringify(items['111'] && items['111'].statusUrl));

      const cen = AD.sel.census();
      check('census counts the cover images', cen.articleMarkers === 1, String(cen.articleMarkers));
      check('census reports the marker as in-post',
        cen.articleish.length === 1 && cen.articleish[0].insideTweet === true,
        JSON.stringify(cen.articleish));
      check('census finds no article links, matching the live reading',
        cen.pageWideSpecialLinks.length === 0,
        JSON.stringify(cen.pageWideSpecialLinks));

      // Re-harvesting the same rendered posts must not duplicate them.
      await AD.collect.harvestVisible(await store.getSettings());
      check('re-harvest is idempotent',
        Object.keys(await store.getItems()).length === 4,
        String(Object.keys(await store.getItems()).length));

      // 'likely' drives what the fetch step opens by default.
      const c = await store.counts();
      check('default scope holds back the unlikely one',
        c.fetchable === 3, `fetchable ${c.fetchable} of pending ${c.pending}`);
      await store.setSettings({ fetchScope: 'all' });
      check('"everything" scope offers all four',
        (await store.counts()).fetchable === 4,
        String((await store.counts()).fetchable));
      await store.setSettings({ fetchScope: 'likely' });
    }

    section('article body extraction');
    {
      const { dropTitleEcho, blocksFromArticle } = AD.extract;

      eq2('drops a title echo at the top',
        dropTitleEcho([{text:'The Big Idea'},{text:'Real prose follows here.'}], 'The Big Idea')
          .map(b => b.text),
        ['Real prose follows here.']);
      eq2('matches past punctuation and case',
        dropTitleEcho([{text:'THE  BIG, IDEA!'},{text:'Body.'}], 'The Big Idea').map(b => b.text),
        ['Body.']);
      eq2('leaves a body that does not echo alone',
        dropTitleEcho([{text:'Something else'},{text:'Body.'}], 'The Big Idea').map(b => b.text),
        ['Something else', 'Body.']);
      eq2('never strips a mid-article repeat',
        dropTitleEcho([{text:'Body.'},{text:'The Big Idea'}], 'The Big Idea').map(b => b.text),
        ['Body.', 'The Big Idea']);
      eq2('no title is a no-op',
        dropTitleEcho([{text:'A'},{text:'B'}], null).map(b => b.text), ['A', 'B']);

      // Semantic markup: tags decide, no guessing.
      const semantic = document.createElement('div');
      semantic.innerHTML = '<h2>Why It Matters</h2><p>First paragraph of real prose.</p>' +
        '<p>Second paragraph.</p><li>A bullet</li><blockquote>A quote</blockquote>';
      const sb = blocksFromArticle(semantic);
      eq2('headings come from the tag', sb[0], { type: 'heading', text: 'Why It Matters' });
      check('bullets are marked', sb.some((b) => b.text.startsWith('•')));
      check('quotes are marked', sb.some((b) => b.text.startsWith('\u201c')));

      // THE regression: X emits headings as real <h2> but body paragraphs as
      // plain <div>. Three-plus semantic elements were satisfied by the
      // headings alone, so the semantic branch won and every div of prose was
      // discarded — five headings in, five heading-only cards out.
      const mixedMarkup = document.createElement('div');
      mixedMarkup.innerHTML =
        '<h2>Stage One: Getting Started</h2>' +
        '<div>Real prose that lives in a plain div and must not be lost. ' +
        'It carries the actual substance of the section.</div>' +
        '<h2>Stage Two: Scaling Up</h2>' +
        '<div>More prose in another div, equally at risk of being dropped ' +
        'on the floor by a selector that only understands paragraphs.</div>' +
        '<h2>Stage Three: Enterprise Adoption</h2>' +
        '<div>Closing prose that rounds the whole thing out nicely.</div>';
      document.body.appendChild(mixedMarkup);

      const mm = blocksFromArticle(mixedMarkup);
      const mmHeadings = mm.filter((b) => b.type === 'heading').length;
      check('div prose is not discarded when headings are semantic',
        mm.length > mmHeadings, JSON.stringify(mm.map((b) => b.type)));
      check('the prose actually made it through',
        mm.some((b) => b.text.includes('carries the actual substance')));
      check('headings are still recognised as headings',
        mmHeadings === 3, String(mmHeadings));

      const mmQ = AD.extract.assessBlocks(mm, mixedMarkup);
      check('quality check sees good coverage', mmQ.coverage > 0.9,
        String(mmQ.coverage));
      check('and a sane heading ratio', mmQ.headingRatio < 0.6,
        String(mmQ.headingRatio));

      const mmCards = AD.chunker.chunk(mm, { maxCards: 5 });
      check('cards carry body text, not just headings',
        mmCards.every((c) => c.text && c.text.length > 40),
        JSON.stringify(mmCards.map((c) => c.text.length)));
      mixedMarkup.remove();

      // A genuinely heading-only extraction must be caught, not shipped.
      const headOnly = document.createElement('div');
      headOnly.innerHTML = '<h2>Alpha</h2><h2>Beta</h2><h2>Gamma</h2><h2>Delta</h2>';
      document.body.appendChild(headOnly);
      const hq = AD.extract.assessBlocks(blocksFromArticle(headOnly), headOnly);
      check('an all-headings grab is flagged by the quality check',
        hq.headingRatio > 0.8, String(hq.headingRatio));
      headOnly.remove();

      // Nested-div rich text: the case that produced all-headings cards.
      const soup = document.createElement('div');
      soup.innerHTML = '<div><div><span>Most evaluation regimes reward the answer ' +
        'and ignore the path taken to reach it.</span></div></div>' +
        '<div><div><span>That is a reasonable shortcut when work is cheap to verify.</span></div></div>';
      document.body.appendChild(soup);
      const db = blocksFromArticle(soup);
      check('nested divs do not shatter into fragments', db.length <= 3,
        `${db.length} blocks: ` + JSON.stringify(db.map((b) => b.text.slice(0, 25))));
      check('prose survives intact',
        db.some((b) => b.text.includes('ignore the path taken to reach it')));
      const chunked = AD.chunker.chunk(db);
      check('and does not come back as headings',
        chunked.every((s) => s.kind === 'para'),
        JSON.stringify(chunked.map((s) => s.kind)));
      soup.remove();
    }

    section('card rendering');
    {
      await fresh(12, 0, { everyNPosts: 3 });
      await store.upsertItem({ id: 'CR', url: 'u', kind: 'article',
        title: 'A Article', author: { name: 'A', handle: 'a' } });
      // Comfortably past the 12-line clamp at any plausible column width.
      const longRun = 'This section runs on at length so the card has to clamp it. '.repeat(30);
      await store.setSnippets('CR', [
        { text: 'Short body under a heading.', kind: 'para', heading: 'Section One' },
        { text: longRun, kind: 'para', heading: 'Section Two' },
        { text: 'No heading on this one.', kind: 'para', heading: null },
      ]);
      inject._resetLayout(); AD.card.releaseAll();
      await inject.sweep();
      await new Promise((r) => setTimeout(r, 250));

      const cs = cards();
      check('renders the section heading above the body',
        cs[0].querySelector('.ad-heading').textContent === 'Section One',
        JSON.stringify(cs[0].querySelector('.ad-heading').textContent));
      check('a short card offers no Show more',
        cs[0].querySelector('.ad-more').style.display === 'none');
      check('a long card does',
        cs[1].querySelector('.ad-more').style.display !== 'none');

      const long = cs[1];
      long.querySelector('[data-ad-act="more"]').click();
      check('expanding lifts the clamp', long.classList.contains('is-expanded'));
      check('and the control flips to Show less',
        long.querySelector('.ad-more').textContent === 'Show less');
      long.querySelector('[data-ad-act="more"]').click();
      check('collapsing puts it back', !long.classList.contains('is-expanded'));

      check('enough cards were placed to cover all three snippets',
        cs.length >= 3, `only ${cs.length}`);
      check('a snippet with no heading hides the heading row',
        cs[2] && cs[2].querySelector('.ad-heading').style.display === 'none');
    }

    section('incremental re-harvest');
    {
      // A second harvest over unchanged bookmarks must stop scrolling instead
      // of re-reading the whole backlog.
      let steps = 0;
      const origScroll = AD.dom.autoScroll;
      AD.dom.autoScroll = async (opts) => {
        // Stand in for a long list: always "loads more", never runs out.
        for (let i = 0; i < 20; i++) {
          steps++;
          await opts.onStep(i);
          if (opts.shouldStop && opts.shouldStop()) break;
        }
        if (opts.onStep) await opts.onStep(-1);
      };

      await store.setSettings({ incrementalHarvest: true });

      // Build and harvest a bookmarks list of our own rather than inheriting
      // whatever the previous section left in the feed — those posts have no
      // permalinks, so nothing would be recognisable on the second pass.
      __resetStorage();
      feed.innerHTML = '';
      const btl = document.createElement('div');
      btl.setAttribute('aria-label', 'Timeline: Bookmarks');
      for (let i = 0; i < 5; i++) {
        btl.appendChild(fakeBookmark({
          handle: 'someone', id: '90' + i,
          text: 'A bookmarked post with plenty of body text to be worth keeping. '.repeat(8),
        }));
      }
      feed.appendChild(btl);
      await AD.collect.harvestVisible(await store.getSettings());

      // Case 1: fresh page load — adSeen marks are gone, so every post is
      // re-read and recognised as already known.
      for (const t of document.querySelectorAll('[data-testid="tweet"]')) {
        delete t.dataset.adSeen;
      }
      steps = 0;
      const reloaded = await AD.collect.harvestAll();
      check('after a reload, stops early on familiar bookmarks',
        reloaded.stoppedEarly === true, JSON.stringify(reloaded));
      check('and does so within a few screenfuls', steps <= 5, `${steps} steps`);
      check('reports nothing new', reloaded.found === 0, String(reloaded.found));
      check('but does report what it recognised',
        reloaded.revisited > 0, String(reloaded.revisited));

      // Case 2: re-run in the same tab — adSeen suppresses every post, so the
      // harvest sees neither fresh nor known. It must still stop.
      steps = 0;
      const sameSession = await AD.collect.harvestAll();
      check('re-running in the same tab also stops early',
        sameSession.stoppedEarly === true, JSON.stringify(sameSession));
      check('without scrolling the whole list', steps <= 5, `${steps} steps`);

      await store.setSettings({ incrementalHarvest: false });
      steps = 0;
      const full = await AD.collect.harvestAll();
      check('full re-scan keeps going when the setting is off',
        full.stoppedEarly === false && steps === 20, `${steps} steps`);

      AD.dom.autoScroll = origScroll;
      await store.setSettings({ incrementalHarvest: true });
    }

    // MUST be last: teardown is one-shot and global, so everything after it
    // would be running against a dead context.
    section('orphaned content script');
    {
      const { life } = AD;

      check('recognises the real Chrome message',
        life.isContextError(new Error('Extension context invalidated.')));
      check('and the messaging variants',
        life.isContextError(new Error('Could not establish connection. Receiving end does not exist.')));
      check('but not an ordinary bug',
        !life.isContextError(new TypeError('x.foo is not a function')));

      let ticks = 0;
      life.guardedInterval(() => { ticks++; }, 10);
      let cleaned = false;
      life.onTeardown(() => { cleaned = true; });

      // Put a live card on screen so we can watch it get marked inert.
      await fresh(6, 5, { everyNPosts: 3 });
      inject._resetLayout(); AD.card.releaseAll();
      await inject.sweep();
      const before = cards().length;
      check('a card is on screen to begin with', before > 0, String(before));

      check('still alive before the extension goes away', life.isAlive());
      chrome.runtime.id = undefined;            // simulate the reload
      check('check() notices and returns false', life.check() === false);
      check('registered cleanups ran', cleaned);

      const stale = cards();
      check('cards are left in place, not yanked out',
        stale.length === before, `${before} then ${stale.length}`);
      check('but marked stale', stale.every((c) => c.classList.contains('is-stale')));
      check('with their buttons disabled',
        stale.every((c) => [...c.querySelectorAll('button')].every((b) => b.disabled)));
      check('and a note telling you what to do',
        stale[0].querySelector('.ad-badge').textContent === 'reload tab to resume');

      const at = ticks;
      await new Promise((r) => setTimeout(r, 60));
      check('guarded intervals stopped', ticks === at, `${at} then ${ticks}`);

      await inject.sweep();
      check('sweeping after teardown is a no-op, not a throw',
        cards().length === before);
      check('teardown is idempotent', (life.teardown('again'), true));

      // Teardown is one-shot by design, so put the world back explicitly or
      // nothing after this point in the page can run.
      chrome.runtime.id = 'harness';
      life._reset();
      check('the harness can carry on after a simulated teardown', life.isAlive());
    }

    /* ---------------------------------------------------------------- */
    const sum = document.createElement('div');
    sum.id = 'summary';
    sum.textContent = `${pass} passed, ${fail} failed`;
    sum.style.background = fail ? '#fdd' : '#dfd';
    out.appendChild(sum);
    document.title = fail ? `FAIL (${fail})` : `PASS (${pass})`;
    globalThis.__harness = { pass, fail };
  })();
  </script>
</body>
</html>
